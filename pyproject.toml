[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "zwi"
version = "0.1.0"
description = "Zip with ignore — create zip archives that respect .gitignore rules"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
python-source = "python"
strip = true
