[package]
name = "zwi"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Zip with ignore — create zip archives that respect .gitignore rules"
license = "MIT"

[[bin]]
name = "zwi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ignore = "0.4"
indicatif = "0.18"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
